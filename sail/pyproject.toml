[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sail-toolkit"
version = "1.1.0"
description = "SAIL-GPL Super AI release integrity and technical evidence verification"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-SAIL-GPL-1.0"
license-files = ["LICENSE.md"]
authors = [{ name = "The Open Reality Initiative" }]
keywords = ["sail-gpl", "super-ai", "model-signing", "saibom", "provenance", "supply-chain"]
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
# Post-quantum (ML-DSA / FIPS 204) and hybrid signing. Required only for
# --alg ml-dsa-65 / --alg hybrid (SAIL-GPL Sections 7.5 and 8).
pq = ["liboqs-python>=0.16.0.1,<0.17"]
dev = ["pytest>=7"]

[project.scripts]
sail = "sail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
